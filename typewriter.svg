<svg xmlns="http://w3.org" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Imports the Playfair Display font directly from Google Fonts -->
    <style>
      @import url('https://googleapis.com');
      
      .stage {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 42px;
        font-weight: 700;
        fill: #e11d2e;
      }

      /* Base layout for the animated text blocks */
      .text-box {
        overflow: hidden;
        white-space: nowrap;
        border-right: 3px solid #e11d2e; /* The blinking cursor/caret */
        width: 0;
        opacity: 0;
      }

      /* Global Cursor Blinking Animation */
      @keyframes blink {
        0%, 100% { border-color: transparent }
        50% { border-color: #e11d2e }
      }

      /* Sequence for Phrase 1 (Total loop duration: 12 seconds) */
      @keyframes cycle-phrase-1 {
        0% { width: 0; opacity: 1; }
        25% { width: 100%; opacity: 1; }   /* Types out completely over 3 seconds */
        45% { width: 100%; opacity: 1; }   /* Holds visible for 2.4 seconds */
        50% { width: 0; opacity: 1; }      /* Deletes over 0.6 seconds */
        51%, 100% { width: 0; opacity: 0; } /* Stays hidden while phrase 2 plays */
      }

      /* Sequence for Phrase 2 (Total loop duration: 12 seconds) */
      @keyframes cycle-phrase-2 {
        0%, 50% { width: 0; opacity: 0; }  /* Stays hidden while phrase 1 plays */
        51% { width: 0; opacity: 1; }
        75% { width: 100%; opacity: 1; }   /* Types out completely over 3 seconds */
        95% { width: 100%; opacity: 1; }   /* Holds visible for 2.4 seconds */
        100% { width: 0; opacity: 1; }    /* Deletes over 0.6 seconds */
      }

      .p1 {
        animation: cycle-phrase-1 12s steps(30) infinite, blink 0.8s step-end infinite;
      }

      .p2 {
        animation: cycle-phrase-2 12s steps(30) infinite, blink 0.8s step-end infinite;
      }
    </style>
  </defs>

  <!-- Clean white background canvas -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Centered positioning container -->
  <g class="stage">
    <!-- Phrase 1 Layer -->
    <svg class="text-box p1" x="50" y="70" width="700" height="70">
      <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle">love us, together,</text>
    </svg>
    
    <!-- Phrase 2 Layer -->
    <svg class="text-box p2" x="50" y="70" width="700" height="70">
      <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle">an eater, i need her</text>
    </svg>
  </g>
</svg>
